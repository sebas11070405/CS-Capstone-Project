name: Test

# Runs on every pull request, whatever branch it targets, and on pushes to main
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # On a pull request, test the PR's own latest commit instead of GitHub's
    # preview of it merged into the base branch. On a push, this is empty and
    # checkout uses the pushed commit.
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    # The database tests connect to Supabase, so the credentials come from repo secrets
    - name: Run tests
      run: ./gradlew test --console=plain
      env:
        DB_URL: ${{ secrets.DB_URL }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
